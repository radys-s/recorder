name: recorder
description: "Aftermind: AI asistent do školy, který nahrává a rozumí hodinám."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+2

environment:
  sdk: ^3.13.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Czech Material/Cupertino strings, so system-provided UI matches the app
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Audio recording
  record: ^6.0.0

  # Android foreground service + persistent notification while recording
  flutter_foreground_task: ^9.1.0

  # Local reactive SQLite storage
  drift: ^2.23.0
  sqlite3: ^3.5.2
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Groq API key storage (Keychain/Keystore-backed)
  flutter_secure_storage: ^9.2.4

  # HTTP client for Groq multipart upload
  dio: ^5.7.0

  # State management
  flutter_riverpod: ^2.6.1

  # Date/duration formatting
  intl: ^0.20.2

  # Connectivity-restored events for the upload queue worker
  connectivity_plus: ^6.1.3

  # Opening a web answer's sources in the system browser. A search result is
  # untrusted content and has no business rendering inside this app.
  url_launcher: ^6.3.1
  image_picker: ^1.2.3
  share_plus: ^12.0.2
  flutter_local_notifications: ^22.3.1

  # Already pulled in by flutter_local_notifications; declared directly because
  # the scheduler imports it to name the instant a reminder fires.
  timezone: ^0.11.1

  # Already locked (a dependency of other packages); the Google sign-in
  # hashes its PKCE verifier with it.
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  build_runner: ^2.4.13
  drift_dev: ^2.23.0

  # Build-time only: expands assets/icon/*.png into every launcher size both
  # platforms want. Nothing in lib/ imports it and it ships in no build.
  flutter_launcher_icons: ^0.14.4

# Regenerate the sources with `python tool/generate_icon.py`, then re-run
# `dart run flutter_launcher_icons` to expand them. The adaptive foreground is a
# separate file because Android masks the outer third of it away, so the glyph
# in it is drawn smaller than the one on the full-bleed tile.
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  ios: true
  # iOS rejects an app icon with an alpha channel; the source has none, but the
  # tool re-encodes and this makes that guarantee explicit.
  remove_alpha_ios: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Inter, bundled rather than fetched at runtime (google_fonts) — an app whose
  # whole point is surviving a network dropout must not need the network to
  # render its own text. These are subsetted to Latin + Latin Extended-A +
  # General Punctuation with the `tnum` feature kept, which covers every Czech
  # glyph and the tabular figures the transcript timestamps depend on; 64 KB per
  # weight instead of ~320 KB. OFL.txt is the licence and must ship with them.
  #
  # Bricolage Grotesque, same reasoning, for display/heading text (wordmark,
  # screen titles, card/tile titles) — Inter stays for body text. Instanced
  # from the variable font at wght 700/800, opsz 96, then subsetted the same
  # way as Inter; ~66 KB per weight. OFL-BricolageGrotesque.txt is its licence.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
