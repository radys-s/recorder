# Builds an unsigned iOS IPA for sideloading with SideStore.
#
# No Apple account, certificate or provisioning profile is involved anywhere:
# SideStore re-signs the IPA on the phone with the user's own free Apple ID.
name: iOS build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Pinned to the exact version the app is developed and tested with;
      # pubspec.lock will not resolve on an older runner default.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          rm -rf Payload recorder.ipa
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry recorder.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: recorder-ipa
          path: recorder.ipa
          retention-days: 14
          if-no-files-found: error
