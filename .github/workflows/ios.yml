# Builds an unsigned iOS IPA for sideloading with SideStore.
#
# No Apple account, certificate or provisioning profile is involved anywhere:
# SideStore re-signs the IPA on the phone with the user's own free Apple ID.
name: iOS build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Pinned to the exact version the app is developed and tested with;
      # pubspec.lock will not resolve on an older runner default.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          rm -rf Payload Aftermind-1.0.0-build2-unsigned.ipa Aftermind-1.0.0-build2-unsigned.ipa.sha256
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Aftermind-1.0.0-build2-unsigned.ipa Payload
          shasum -a 256 Aftermind-1.0.0-build2-unsigned.ipa > Aftermind-1.0.0-build2-unsigned.ipa.sha256

      - name: Verify IPA
        run: |
          unzip -t Aftermind-1.0.0-build2-unsigned.ipa
          test -d Payload/Runner.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/Runner.app/Info.plist)" = "com.tomasradek.recorder.recorder"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Payload/Runner.app/Info.plist)" = "1.0.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Payload/Runner.app/Info.plist)" = "2"

      - uses: actions/upload-artifact@v4
        with:
          name: Aftermind-iOS-1.0.0-build2
          path: |
            Aftermind-1.0.0-build2-unsigned.ipa
            Aftermind-1.0.0-build2-unsigned.ipa.sha256
          retention-days: 14
          if-no-files-found: error
