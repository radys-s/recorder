org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# The JDK's bundled cacerts store doesn't include a root CA that Windows
# itself trusts (likely added by AV/EDR HTTPS scanning), which breaks
# Gradle's dependency downloads with PKIX path errors. Point the JVM at the
# Windows Trusted Root store instead, matching what curl/the OS already trust.
systemProp.javax.net.ssl.trustStoreType=Windows-ROOT
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
